<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>YOFI - Transação</title>
    <link
        rel="stylesheet"
        href="for.css"
    >

     <header class="topbar">


        <!-- BOTÃO MENU -->
        <button
            id="menuBtn"
            class="menu-btn"
            aria-label="Abrir menu"
        >
            ☰
        </button>


        <!-- LOGO / NOME -->
        <div class="topbar-logo">
            YOFI
        </div>


        <!-- NOTIFICAÇÕES -->
        <div class="notification-container">

            <button
                id="notificationBtn"
                class="notification-btn"
                aria-label="Notificações"
            >

                🔔

                <span id="notificationCount">
                    0
                </span>

            </button>


            <div
                id="notificationPanel"
                class="notification-panel hidden"
            >

                <h3>
                    Notificações
                </h3>

                <div id="notificationList">
                </div>

            </div>

        </div>

    </header>


</head>

<body>
    <!-- =========================================================
         ÁREA PRINCIPAL
         ========================================================= -->

    <main class="movimentacao-container">

        <!-- =====================================================
             CABEÇALHO DO FORMULÁRIO
             ===================================================== -->

        <header class="movimentacao-header">

            <h1 id="tituloFormulario">
                Nova movimentação
            </h1>

            <p id="subtituloFormulario">
                Registre sua movimentação financeira.
            </p>

        </header>

        <!-- =====================================================
             FORMULÁRIO PRINCIPAL
             ===================================================== -->
<!--GASTOS-->
    <div class="display-on">    
        <form
            id="gastosForm"
            class="movimentacao-form"
        >
            <!-- =================================================
                 CAMPO: VALOR
                 ================================================= -->

            <div class="campo valor-campo">

                <label for="valor">
                    VALOR
                </label>

                <div class="valor-input">
                    <span>
                        R$
                    </span>

                     <input
                        type="number"
                        id="valor"
                        name="valor"
                        placeholder="0,00"
                        min="0"
                        step="0.01"
                        inputmode="decimal"
                        required
                    >
                </div>
            </div>

            <!-- =================================================
                CAMPO: CATEGORIA
            ================================================= -->

            <div class="campo">

                <label for="categoriaGastos">
                    CATEGORIA
                </label>

                <select
                    id="categoria"
                    name="categoria"
                    required
                >
                    <option value="">
                       Escolha uma Categoria
                    </option>

                    <!-- Categorias de gastos -->

                    <option value="alimentacao">
                        ALIMENTAÇÃO
                    </option>

                    <option value="transporte">
                        TRANSPORTE
                    </option>

                    <option value="moradia">
                        MORADIA
                    </option>

                    <option value="lazer">
                        LAZER
                    </option>

                    <option value="saude">
                        SAÚDE
                    </option>

                    <option value="educacao">
                        EDUCAÇÃO
                    </option>

                    <option value="compras">
                        COMPRAS
                    </option>

                    <option value="assinaturas">
                        ASSINATURAS
                    </option>

                    <option value="outros">
                        OUTROS
                    </option>

                </select>

            </div>



            <!-- =================================================
                 CAMPO: DESCRIÇÃO
                 ================================================= -->

            <div class="campo">

                <label for="descricao">

                    Descrição

                    <span class="opcional">
                        opcional
                    </span>

                </label>


                <input
                    type="text"
                    id="descricaoGasto"
                    name="descricao"
                    placeholder="Ex: almoço, mercado, salário..."
                >

            </div>


            <!-- =================================================
                 CAMPO: DATA
                 ================================================= -->

            <div class="campo">

                <label for="data">
                    Data
                </label>


                <input
                    type="date"
                    id="dataGasto"
                    name="data"
                    required
                >

            </div>


            <!-- =================================================
                 BOTÃO ENVIAR
                 ================================================= -->

            <button
                type="submit"
                dataid="btnOk1"
                name="acao"
                value="enviar"
                class="botao-salvar"
            >
                Confirmar
            </button>


        </form>
    </div>

    </main>



    <!-- =========================================================
         RODAPÉ DE CATEGORIA
    ========================================================= -->

    <footer class="categoria-footer">


        <div class="categoria-container">


            <!-- =================================================
                 BOTÃO GASTOS
                 ================================================= -->

            <button
                type="button"
                data-id="gastosForm"
                name="categoriaGastos"
                value="gasto"
                class="categoria-btn ativo"
                onclick="trocarDisplay(gastosForm)"
            >

                <span class="categoria-titulo">
                    Despesas
                </span>

                <span class="categoria-descricao">
                    Seus Gastos
                </span>

            </button>


            <!-- =================================================
                 BOTÃO ENTRADA
                 ================================================= -->

            <button
                type="button"
                data-id="ganhosForm"
                name="categoriaEntrada"
                value="entrada"
                class="categoria-btn"
                onclick="trocarDisplay(ganhosForm)"
            >

                <span class="categoria-titulo">
                    Entradas
                </span>

                <span class="categoria-descricao">
                    Seus Ganhos
                </span>

            </button>


            <!-- =================================================
                 BOTÃO TRANSAÇÃO
                 ================================================= -->

            <button
                type="button"
                data-id="movimentacaoForm"
                name="categoriaTransacao"
                value="transacao"
                class="categoria-btn"
                onclick="trocarDisplay(movimentacaoForm)"
            >

                <span class="categoria-titulo">
                    Movimentações
                </span>

                <span class="categoria-descricao">
                    Transações Entre Bancos
                </span>

            </button>


        </div>

    </footer>


</body>

</html>
