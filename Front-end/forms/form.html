<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cadastro de Transações Financeiras">
    <title>Yofi/Transações</title>

    <link  rel="stylesheet" href="for.css">
</head>

<body>

    <header class="navbar">
    <div class="logo">YOFI/Inicio</div>
    <nav>
        <a href="https://luiscript-ed.github.io/YOFI/Front-end/Inicial/page">Início</a>
        <a href="https://luiscript-ed.github.io/YOFI/Front-end/Mya/Ia">IA Financeira</a>
    </nav>
    </header>

    <div class="container">
        <form id="transacaoForm">
    <h1>Nova Transação</h1>

    <label for="tipo">Tipo de Transação</label>
    <select id="tipo" name="tipo" required>
        <option value="" disabled selected>Selecione o tipo</option>
        <option value="gasto">Gasto (Saída)</option>
        <option value="ganho">Ganho (Entrada)</option>
    </select>

    <label for="categoria">Categoria</label>
    <select id="categoria" name="categoria" required>
        <option value="" disabled selected>Selecione uma categoria</option>

        <optgroup label="Ganhos / Receitas">
            <option value="freelance">Freelance / Investimentos</option>
            <option value="outros_ganhos">Outros Ganhos</option>
        </optgroup>

        <optgroup label="Gastos / Despesas">
            <option value="alimentacao">Alimentação</option>
            <option value="transporte">Transporte</option>
            <option value="moradia">Moradia</option>
            <option value="lazer">Lazer</option>
            <option value="saude">Saúde</option>
            <option value="outros_gastos">Outros Gastos</option>
        </optgroup>
    </select>

    <label for="valor">Valor (R$)</label>
    <input
        type="number"
        id="valor"
        name="valor"
        step="0.01"
        min="0.01"
        placeholder="0,00"
        required
    >

    <label for="data">Data</label>
    <input type="date" id="data" name="data" required>

    <label for="descricao">Descrição</label>
    <textarea
        id="descricao"
        name="descricao"
        placeholder="Ex: Compras do mês..."
    ></textarea>

    <button type="submit">
        Cadastrar Transação
    </button>

    <a href="https://luiscript-ed.github.io/YOFI/Front-end/Inicial/page" class="btn-voltar">
        ← Voltar para pagina inicial
    </a>
</form>
    </div>

    <script src="forms.js"></script>

</body>
</html>
