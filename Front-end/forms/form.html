<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cadastro de Transações Financeiras">
    <title>Yofi/Transações</title>

    <style>   
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #170f2b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        form {
            background-color: #3e0953;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #f9f9f9;
            font-size: 24px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #fbf7f7;
            font-weight: bold;
            font-size: 14px;
        }

        /* Estilização para inputs, selects e textarea ficarem padronizados */
        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #f0efef;
            border-radius: 5px;
            background-color: #ffffff;
            color: #333333;
            font-size: 16px;
        }

        /* Foco nos campos */
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #0078ff;
            box-shadow: 0 0 5px rgba(0, 120, 255, 0.5);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* Estilo do botão de envio */
        button {
            width: 100%;
            padding: 14px;
            background-color: #0078ff;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #005fcc;
        }

        /* Link discreto para voltar à página inicial pós-login */
        .btn-voltar {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #b39ddb;
            text-decoration: none;
            font-size: 14px;
        }

        .btn-voltar:hover {
            text-decoration: underline;
        }

        .navbar{
    position:fixed;
    top:0;
    width:100%;
    height:70px;

    background:#140c25;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 40px;

    border-bottom:1px solid #2a1d47;

    z-index:1000;
}

.logo{
    font-size:32px;
    font-weight:bold;
    color:#8b5cf6;
}

.navbar nav{
    display:flex;
    gap:30px;
}

.navbar nav a{
    color:white;
    text-decoration:none;
    transition:.2s;
}

.navbar nav a:hover{
    color:#8b5cf6;
}
    </style>
</head>
<body>

    <header class="navbar">
    <div class="logo">YOFI/Inicio</div>
    <nav>
        <a href="https://luiscript-ed.github.io/YOFI/Front-end/Inicial/page">Início</a>
        <a href="https://luiscript-ed.github.io/YOFI/Front-end/MYA/Ia">IA Financeira</a>
    </nav>
    </header>

    <div class="container">
        <form id="transacaoForm">
    <h1>Nova Transação</h1>

    <label for="tipo">Tipo de Transação</label>
    <select id="tipo" name="tipo" required>
        <option value="" disabled selected>Selecione o tipo</option>
        <option value="gasto">Gasto (Saída)</option>
        <option value="ganho">Ganho (Entrada)</option>
    </select>

    <label for="categoria">Categoria</label>
    <select id="categoria" name="categoria" required>
        <option value="" disabled selected>Selecione uma categoria</option>

        <optgroup label="Ganhos / Receitas">
            <option value="salario">Salário</option>
            <option value="freelance">Freelance / Investimentos</option>
            <option value="outros_ganhos">Outros Ganhos</option>
        </optgroup>

        <optgroup label="Gastos / Despesas">
            <option value="alimentacao">Alimentação</option>
            <option value="transporte">Transporte</option>
            <option value="moradia">Moradia</option>
            <option value="lazer">Lazer</option>
            <option value="saude">Saúde</option>
            <option value="outros_gastos">Outros Gastos</option>
        </optgroup>
    </select>

    <label for="valor">Valor (R$)</label>
    <input
        type="number"
        id="valor"
        name="valor"
        step="0.01"
        min="0.01"
        placeholder="0,00"
        required
    >

    <label for="data">Data</label>
    <input type="date" id="data" name="data" required>

    <label for="descricao">Descrição</label>
    <textarea
        id="descricao"
        name="descricao"
        placeholder="Ex: Compras do mês..."
    ></textarea>

    <button type="submit">
        Cadastrar Transação
    </button>

    <a href="https://luiscript-ed.github.io/YOFI/Front-end/Inicial/page" class="btn-voltar">
        ← Voltar para pagina inicial
    </a>
</form>
    </div>

    <script>

    const form = document.getElementById("transacaoForm");

    form.addEventListener("submit", async (e) => {

        e.preventDefault();

        const usuario_id = localStorage.getItem("usuario_id");

        const tipo = document.getElementById("tipo").value;
        const categoria = document.getElementById("categoria").value;
        const valor = document.getElementById("valor").value;
        const descricao = document.getElementById("descricao").value;

        const dados = {
        usuario_id: Number(usuario_id),
        tipo: tipo,
        categoria: categoria,
        valor: Number(valor),
        descricao: descricao
        };

        try {

            const resposta = await fetch(
            "https://yofi-api.onrender.com/transacao",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(dados)
            }
        );

        const resultado = await resposta.json();

        if (resposta.ok) {

            alert("Transação cadastrada com sucesso!");

            form.reset();

            } else {

            alert(resultado.detail);

        }

    } catch (erro) {

        console.error(erro);

        alert("Erro ao conectar com o servidor.");

    }

});

</script>

</body>
</html>
