<div class="app">


    <!-- ===================================================== -->
    <!-- NAVBAR SUPERIOR -->
    <!-- ===================================================== -->

    <header class="topbar">


        <!-- BOTÃO MENU -->
        <button
            id="menuBtn"
            class="menu-btn"
            aria-label="Abrir menu"
        >
            ☰
        </button>


        <!-- LOGO / NOME -->
        <div class="topbar-logo">
            YOFI
        </div>


        <!-- ================================================= -->
        <!-- MÊS -->
        <!-- ================================================= -->

        <div class="month-selector">

            <button
                id="mesAnterior"
                class="month-btn"
                aria-label="Mês anterior"
            >
                ‹
            </button>

            <div class="month-info">

                <span id="mesAtual">
                    Agosto
                </span>

                <small id="anoAtual">
                    2026
                </small>

            </div>

            <button
                id="proximoMes"
                class="month-btn"
                aria-label="Próximo mês"
            >
                ›
            </button>

        </div>


        <!-- NOTIFICAÇÕES -->
        <div class="notification-container">

            <button
                class="notification-btn"
                aria-label="Notificações"
            >

                🔔

                <span id="notificationCount">
                    0
                </span>

            </button>


            <div
                id="notificationPanel"
                class="notification-panel hidden"
            >

                <h3>
                    Notificações
                </h3>

                <div id="notificationList">
                </div>

            </div>

        </div>
