<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOFI/MYA</title>
    <style>
        /* Estilos baseados no seu código original */
        body{
    background-color:#fdf6ff;
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin:0;
    padding:100px 20px 20px 20px;

    display:flex;
    flex-direction:column;
    align-items:center;
} 
        /* Título */
        .title {
            text-align: center;
            color: #9333EA;
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 20px;
        }

        /* Container do Chat */
        .chat-container {
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        /* Bolhas de mensagem */
        .message-bubble {
            color: black;
            padding: 10px 15px;
            border-radius: 12px;
            margin: 5px 0;
            max-width: 70%;
            word-wrap: break-word;
        }

        .user-message {
            background-color: #f1f0ff;
            align-self: flex-end;
            text-align: right;
        }

        .bot-message {
            background-color: #f9f0ff;
            align-self: flex-start;
            text-align: left;
        }

        .error-message {
            background-color: #ffe6e6;
            color: #cc0000;
            align-self: center;
            text-align: center;
            font-size: 0.9em;
        }

        /* Formulário de Input */
        .chat-form {
            width: 100%;
            max-width: 700px;
            display: flex;
            gap: 10px;
        }

        .input-text {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            outline: none;
        }

        .input-text:focus {
            border-color: #a84ee0;
        }

        button {
            background-color: #a84ee0;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #8e44ad;
        }

        /* NAVBAR */
.navbar{
    position: fixed;
    top: 0;
    left: 0;

    width: 100%;
    height: 70px;

    background: #140c25;

    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 0 30px;
    box-sizing: border-box;

    border-bottom: 1px solid #2a1d47;

    z-index: 1000;
}

/* Grupo Logo + Nome */
.navbar-left{
    display: flex;
    align-items: center;
    gap: 12px;
}

.navbar-logo{
    width: 50px;
    height: 50px;
    object-fit: contain;
}

.navbar-title{
    font-size: 24px;
    font-weight: bold;
    color: #8b5cf6;
}

/* Links */
.navbar nav{
    display: flex;
    gap: 25px;
}

.navbar nav a{
    color: white;
    text-decoration: none;
    font-size: 16px;
    transition: .2s;
}

.navbar nav a:hover{
    color: #8b5cf6;
}

    </style>
</head>
<body>

    <header class="navbar">
    <div class="navbar-left">
        <img src="https://i.ibb.co/Zz0wTfv8/MYA.png" alt="Logo MYA" class="navbar-logo">
        <div class="navbar-title">YOFI</div>
    </div>

    <nav>
        <a href="https://luiscript-ed.github.io/YOFI/Front-end/forms/form">Transações</a>
        <a href="https://luiscript-ed.github.io/YOFI/Front-end/Inicial/page">Inicial</a>
    </nav>
</header>

    <pre> 



        
    </pre>

    <h1 class="title">MYA</h1>

    <div class="chat-container" id="chatContainer"></div>

    <form class="chat-form" id="chatForm">
        <input type="text" id="userInput" class="input-text" placeholder="Digite sua mensagem:" required autocomplete="off">
        <button type="submit">Enviar</button>
    </form>

    <script>
        const chatContainer = document.getElementById('chatContainer');
const chatForm = document.getElementById('chatForm');
const userInput = document.getElementById('userInput');

const API_URL = "https://yofi-api.onrender.com/mya";

function appendMessage(text, role) {

    const messageDiv = document.createElement('div');

    messageDiv.classList.add('message-bubble');

    if(role === 'user'){
        messageDiv.classList.add('user-message');
    }
    else if(role === 'bot'){
        messageDiv.classList.add('bot-message');
    }
    else{
        messageDiv.classList.add('error-message');
    }

    messageDiv.textContent = text;

    chatContainer.appendChild(messageDiv);

    chatContainer.scrollTop = chatContainer.scrollHeight;
}

chatForm.addEventListener('submit', async (e) => {

    e.preventDefault();

    const message = userInput.value.trim();

    if(!message) return;

    appendMessage(message, 'user');

    userInput.value = '';

    const loadingMessage = document.createElement('div');

    loadingMessage.classList.add(
        'message-bubble',
        'bot-message'
    );

    loadingMessage.textContent = "MYA está analisando...";

    chatContainer.appendChild(loadingMessage);

    try{

        const response = await fetch(API_URL, {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                pergunta: message
            })

        });

        loadingMessage.remove();

        if(!response.ok){

            throw new Error(
                `Erro ${response.status}`
            );

        }

        const data = await response.json();

        appendMessage(
            data.resposta,
            'bot'
        );

    }
    catch(error){

        loadingMessage.remove();

        appendMessage(
            `Erro: ${error.message}`,
            'error'
        );

    }

});
    </script>

</body>
</html>
